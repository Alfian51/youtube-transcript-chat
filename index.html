<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Search Timestamp (Ctrl+F Video)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header & Search Bar -->
        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-800">Cari Kata Kunci di Video</h1>
            <p class="text-sm text-gray-500 mt-1">Sistem pencarian transkrip video pintar berbasis timestamp</p>
            <div class="mt-4 flex justify-center gap-2">
                <input type="text" id="searchInput" placeholder="Ketik kata kunci (misal: informasi)..." 
                       class="w-2/3 p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="cariVideo()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700">
                    Cari
                </button>
            </div>
        </header>

        <!-- Player Video & Hasil -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
            <!-- Pemutar Video YouTube -->
            <div class="bg-white p-4 rounded-xl shadow-md">
                <h2 class="font-bold text-lg mb-2">Video Player</h2>
                <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center">
                    <div id="youtubePlayer"></div>
                </div>
            </div>

            <!-- Daftar Hasil Timestamp -->
            <div class="bg-white p-4 rounded-xl shadow-md">
                <h2 class="font-bold text-lg mb-2">Hasil Pencarian Menit</h2>
                <div id="resultsList" class="space-y-2 max-h-64 overflow-y-auto">
                    <p class="text-gray-400 text-sm">Silakan ketik kata kunci di atas untuk mencari.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Menghubungkan ke file JavaScript terpisah -->
    <script src="app.js"></script>
</body>
</html>
